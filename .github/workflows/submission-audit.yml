name: Submission audit full tests
on:
  pull_request:
    paths:
      - '.github/workflows/submission-audit.yml'
      - 'requirements-final-extension.txt'
      - 'tests/**'
      - 'scripts/**'
  workflow_dispatch:
jobs:
  full-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install -r requirements-final-extension.txt
      - run: python -m compileall -q scripts
      - run: python -m pytest tests/ -q

name: Benchmark larger real ETF portfolios

on:
  pull_request:
    paths:
      - "scripts/large_etf_rf_classical.py"
      - ".github/workflows/large-etf-rf-classical.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data and model dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' yfinance
      - name: Download and validate complete real ETF data
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python scripts/check_extended_etf_data.py --limit 0 --batch 8
      - name: Benchmark RF-driven larger portfolio selection
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python scripts/large_etf_rf_classical.py
      - name: Save actual prices, forecasts and benchmarks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: larger-etf-rf-classical-measurements
          path: results/large_etf_feasibility/*.csv
          if-no-files-found: warn

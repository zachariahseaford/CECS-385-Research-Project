# Manual-only, controlled experiment. Data is downloaded ONCE, shared with all trials.
# Trigger explicitly in GitHub Actions once the run budget is approved.
name: Controlled QAOA with shared frozen ETF snapshot

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' yfinance
      - name: Download and freeze monthly adjusted prices exactly once
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python scripts/check_extended_etf_data.py --limit 0 --batch 8
          sha256sum results/large_etf_feasibility/new_data_source_monthly_prices.csv | tee results/large_etf_feasibility/snapshot_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fixed-etf-price-snapshot
          path: |
            results/large_etf_feasibility/new_data_source_monthly_prices.csv
            results/large_etf_feasibility/new_data_source_coverage.csv
            results/large_etf_feasibility/snapshot_sha256.txt
          if-no-files-found: error

  qaoa:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { etfs: 40, seed: 3 }
          - { etfs: 40, seed: 4 }
          - { etfs: 40, seed: 5 }
          - { etfs: 40, seed: 6 }
          - { etfs: 80, seed: 0 }
          - { etfs: 80, seed: 1 }
          - { etfs: 160, seed: 0 }
          - { etfs: 160, seed: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install simulation dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' scipy qiskit qiskit-aer
      - uses: actions/download-artifact@v4
        with:
          name: fixed-etf-price-snapshot
          path: results/large_etf_feasibility/
      - name: Verify shared dataset fingerprint
        run: |
          cd results/large_etf_feasibility
          sha256sum -c snapshot_sha256.txt
          cat snapshot_sha256.txt
      - name: Run prespecified seed on exact shared dataset
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python -u scripts/repeat_large_qaoa.py --etfs ${{ matrix.etfs }} --seed ${{ matrix.seed }}
      - name: Archive results, including input checksum
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-QAOA-${{ matrix.etfs }}-seed-${{ matrix.seed }}
          path: |
            results/large_etf_feasibility/snapshot_sha256.txt
            results/large_etf_feasibility/qaoa_repeat_*.csv
          if-no-files-found: warn

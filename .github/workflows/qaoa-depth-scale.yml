name: CECS 385 QAOA depth and phase scaling experiment

on:
  pull_request:
    paths:
      - "scripts/qaoa_depth_scale_experiment.py"
      - ".github/workflows/qaoa-depth-scale.yml"
  workflow_dispatch:

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project QAOA dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' scipy matplotlib ipython qiskit qiskit-aer
      - name: Run full prespecified 27-trial factorial study
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python -u scripts/qaoa_depth_scale_experiment.py
      - name: Archive all QAOA trials and summaries, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qaoa-depth-phase-27-trials
          path: results/qaoa_depth_scale/*.csv
          if-no-files-found: warn

name: Repeat larger QAOA trials - predeclared seeds

on:
  pull_request:
    paths:
      - "scripts/repeat_large_qaoa.py"
      - ".github/workflows/repeat-large-qaoa.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { etfs: 40, seed: 3 }
          - { etfs: 40, seed: 4 }
          - { etfs: 40, seed: 5 }
          - { etfs: 40, seed: 6 }
          - { etfs: 80, seed: 0 }
          - { etfs: 80, seed: 1 }
          - { etfs: 160, seed: 0 }
          - { etfs: 160, seed: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' scipy yfinance qiskit qiskit-aer
      - name: Download adjusted ETF histories
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python scripts/check_extended_etf_data.py --limit 0 --batch 8
      - name: Run prespecified QAOA trial
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python -u scripts/repeat_large_qaoa.py --etfs ${{ matrix.etfs }} --seed ${{ matrix.seed }}
      - name: Archive measured data and trial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QAOA-repeat-${{ matrix.etfs }}-seed-${{ matrix.seed }}
          path: results/large_etf_feasibility/*.csv
          if-no-files-found: warn

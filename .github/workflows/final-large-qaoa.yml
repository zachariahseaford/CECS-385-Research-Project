name: Final large ETF frozen data QAOA vs exact and classical

on:
  pull_request:
    paths:
      - "scripts/final_large_qaoa.py"
      - ".github/workflows/final-large-qaoa.yml"
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data and ML dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' yfinance
      - name: Freeze one real ETF price universe
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python -u scripts/check_extended_etf_data.py --limit 0 --batch 8
      - name: Compute consistent classical references, including exact 6/40
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python -u scripts/final_large_prepare.py
      - uses: actions/upload-artifact@v4
        with:
          name: shared-final-large-input
          path: |
            results/final_large/*
            results/large_etf_feasibility/new_data_source_monthly_prices.csv
          if-no-files-found: error
  quantum:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        etfs: [40,80,160]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install QAOA dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' scipy qiskit qiskit-aer
      - uses: actions/download-artifact@v4
        with:
          name: shared-final-large-input
          path: results
      - name: Normalize artifact download paths
        run: |
          test -f results/final_large/frozen_forecasts.npz
          test -f results/final_large/classical_benchmarks.csv
          test -f results/final_large/source_sha256.txt
      - name: Execute bounded QAOA and compare with same classical objective
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python -u scripts/final_large_qaoa.py --etfs ${{ matrix.etfs }}
      - name: Save actual quantum outcomes (or failure evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-large-QAOA-${{ matrix.etfs }}
          path: results/final_large/*.csv
          if-no-files-found: warn

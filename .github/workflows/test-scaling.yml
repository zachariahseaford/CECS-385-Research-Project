name: Check QAOA scaling notebook

on:
  pull_request:
    paths:
      - "data/04_qaoa_etf_scaling.ipynb"
      - "tests/test_qaoa_scaling.py"
      - ".github/workflows/test-scaling.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run scaling notebook checks
        run: python -m unittest discover -s tests -p "test_qaoa_scaling.py" -v

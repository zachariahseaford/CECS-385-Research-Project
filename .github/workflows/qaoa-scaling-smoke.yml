name: Run actual QAOA ETF scaling smoke test

on:
  pull_request:
    paths:
      - "scripts/run_qaoa_scaling.py"
      - ".github/workflows/qaoa-scaling-smoke.yml"
  workflow_dispatch:

jobs:
  real-price-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Run one six-ETF QAOA trial using January 2025 market data
        env:
          MPLBACKEND: Agg
        run: python scripts/run_qaoa_scaling.py --counts 6 --seeds 1 --iterations 8 --opt-shots 64 --final-shots 256
      - name: Save measured experiment files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qaoa-six-etf-real-data-smoke
          path: |
            results/qaoa_size_trials.csv
            results/qaoa_size_benchmarks.csv
            results/qaoa_size_summary.csv
            results/qaoa_size_scaling.png
          if-no-files-found: warn

name: Test 40-qubit QAOA feasibility

on:
  pull_request:
    paths:
      - "scripts/pilot_qaoa_40.py"
      - ".github/workflows/pilot-qaoa-40.yml"
  workflow_dispatch:

jobs:
  qaoa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' scipy yfinance qiskit qiskit-aer
      - name: Download and validate real ETF histories
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python scripts/check_extended_etf_data.py --limit 40 --batch 8
      - name: Run 6-of-40 short QAOA feasibility pilot
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python -u scripts/pilot_qaoa_40.py
      - name: Save actual pilot data or data diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qaoa-40-resource-pilot
          path: results/large_etf_feasibility/*.csv
          if-no-files-found: warn

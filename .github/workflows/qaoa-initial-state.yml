name: CECS 385 QAOA initial state controlled comparison

on:
  pull_request:
    paths:
      - "scripts/qaoa_initial_state_experiment.py"
      - ".github/workflows/qaoa-initial-state.yml"
  workflow_dispatch:

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original QAOA dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' scipy matplotlib ipython qiskit qiskit-aer
      - name: Compare 9 prespecified state initialization tests
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python -u scripts/qaoa_initial_state_experiment.py
      - name: Save all trial and summary results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qaoa-initial-state-trials
          path: results/qaoa_initial_state/*.csv
          if-no-files-found: warn

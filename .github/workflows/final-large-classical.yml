name: Final frozen 40-80-160 ETF classical and exact benchmark

on:
  pull_request:
    paths:
      - "scripts/final_large_prepare.py"
      - ".github/workflows/final-large-classical.yml"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data and modeling dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' yfinance
      - name: Download historical adjusted prices once
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python -u scripts/check_extended_etf_data.py --limit 0 --batch 8
      - name: Compute RF forecasts and exact 6-of-40 benchmark
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python -u scripts/final_large_prepare.py
      - name: Archive frozen input and all benchmarks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-large-exact-benchmarks
          path: |
            results/final_large/*
            results/large_etf_feasibility/new_data_source_monthly_prices.csv
          if-no-files-found: warn

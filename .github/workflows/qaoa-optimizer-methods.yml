name: Compare QAOA COBYLA versus Powell optimizer

on:
  pull_request:
    paths:
      - "scripts/qaoa_optimizer_methods.py"
      - ".github/workflows/qaoa-optimizer-methods.yml"
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2' scipy matplotlib ipython qiskit qiskit-aer
      - name: Compare optimizers using same original ETFs and seeds
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python -u scripts/qaoa_optimizer_methods.py
      - name: Save individual QAOA optimizer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qaoa-optimizer-methods-20
          path: results/qaoa_optimizer_budget/*.csv
          if-no-files-found: warn

name: Verify larger ETF data source

on:
  pull_request:
    paths:
      - "scripts/check_extended_etf_data.py"
      - ".github/workflows/check-extended-etf-data.yml"
  workflow_dispatch:

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy pandas yfinance
      - name: Validate sample ETF adjusted price histories
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python scripts/check_extended_etf_data.py --limit 12 --batch 6
      - name: Save data check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-etf-source-smoke
          path: results/large_etf_feasibility/new_data_source_*.csv
          if-no-files-found: warn
